
override: ""
mode: SW # OF (security metrics separated from sensors), SW (united paradigm)

logging_level: info
container_manager_port: 7777
kafka_topic_update_interval_secs: 30

wandb:
  online: true
  project_name: SereBench
  run_name: My_awesomre_FAIR_run
  group: AWESOME_GROUP
  kafka_broker_url: kafka:9092
  kafka_consumer_group_id: WANDBER
  kafka_auto_offset_reset: earliest
  logging_level: ${logging_level}
  kafka_topic_update_interval_secs: ${kafka_topic_update_interval_secs}

federated_learning:
  logging_level: ${logging_level}
  aggregation_strategy: fedavg    # fedavg, fedyogi, fedmedian, fedprox
  initialization_strategy: xavier   # xavier, he, normal
  aggregation_interval_secs: 25     
  weights_buffer_size: 5
  # Server-side learning rate — used by adaptive strategies (fedyogi).
  # Has no effect when aggregation_strategy is fedavg, fedmedian, or fedprox.
  learning_rate: 0.01
  # FedYogi moment hyperparameters (Reddi et al., 2020)
  yogi_beta1: 0.9
  yogi_beta2: 0.999
  yogi_epsilon: 0.001
  # Probability, in [0, 1], that a message emitted by the FL coordinator
  # (global_weights / global_metrics) is silently dropped before reaching the
  # message queue. Independent of each vehicle's own packet_loss_rate.
  packet_loss_rate: 0.1

security_manager:
  logging_level: ${logging_level}
  kafka_topic_update_interval_secs: ${kafka_topic_update_interval_secs}
  kafka_consumer_group_id: SECURITY_MANAGER
  kafka_auto_offset_reset: earliest
  buffer_size: 10000
  batch_size: 32
  learning_rate: 0.001
  epoch_size: 50
  save_model_freq_epochs: 5
  model_saving_path: sm_model.pth
  training_freq_seconds: 1
  initialization_strategy: xavier   # xavier, he, normal
  probe_metrics:
    - RTT
    - INBOUND
    - OUTBOUND
    - CPU
    - MEM
  input_dim: 3
  hidden_dim: 50
  output_dim: 1
  num_layers: 5
  dropout: 0.1
  optimizer: Adam
  mitigation: True
  sm_port: 5001
  layer_norm: True
  true_positive_reward: 2
  true_negative_reward: 0
  false_positive_reward: -4
  false_negative_reward: -10


default_vehicle_config:
  kafka_broker: kafka:9092
  # The rate of information (i.e., time) is divided by a factor of 100 wrt real time for the sake of speeding up the simulation
  mu_anomalies: 0.157
  mu_normal: 0.117
  alpha: 0.05
  beta: 1.9
  anomaly_classes: all
  diagnostics_classes: all
  time_emulation: True
  ping_thread_timeout: 5
  ping_host: google.com
  probe_frequency_seconds: 5
  # CPU control parameters for container scheduling
  # ------------------------------------------------
  # cpu_period: The scheduling period for CPU time allocation (in microseconds).
  #              Default: 100000 µs (100 ms). You want to keep this fella as is.
  # cpu_quota:  The total CPU time available to the container per period.
  #              Example: 80000 means 80% of ONE CPU core. (Even if the container can use more cores, he will use only 80% of ONE core!)
  #              Set to -1 for no CPU limit (use full CPU capacity). YOU WANT TO KEEP THIS FELLA AT THIS VALUE.
  # cpu_cores:  Comma-separated list of CPU cores available to the container.
  #              Example: "0,1,2,3" restricts to cores 0-3.
  #              Use "all" for all cores on a machine. You might experiment touching THIS value instead...
  cpu_period: 100000
  cpu_quota: -1
  cpu_cores: "all"
  # Additional environment variables for every vehicle container (both producer and consumer)
  # ADD HERE WHAT YOU NEED, THEN OVERWRITE ELSEWHERE...
  common_env_vars:
    http_proxy: ""
    https_proxy: ""
  # standard dev for adversarial attacks:
  Mp_std: 0
  Bp_std: 0
  # Noise std of the producer's adversarial EVAL stream ({vehicle}_eval_*),
  # which feeds the consumer's adversarial-training buffers. Decoupled from the
  # live-stream Mp_std/Bp_std so the adversarial-training augmentation level can
  # be set independently. null -> fall back to Mp_std/Bp_std (legacy behaviour).
  eval_Mp_std: null
  eval_Bp_std: null
  adversarial_training: False
  # Seed for the Train simulator RNG. Controls the data-generation sequence
  # so that experiments are reproducible across runs with the same seed.
  # Overridden per-run by experiments.py via 'set default_vehicle_config.seed <value>'.
  seed: 42
  # Probability, in [0, 1], that any single message this vehicle emits (producer
  # telemetry/health probes, consumer weights/statistics reports) is silently
  # dropped before reaching the message queue (Kafka broker, or the in-process
  # MessageBus in offline_simulation). Simulates a lossy uplink client-side,
  # since neither Kafka nor the offline bus ever drop an accepted write.
  # Override per-vehicle under 'vehicles:' below, e.g. 'bob: {packet_loss_rate: 0.3}'.
  packet_loss_rate: 0.1


vehicles:
  - angela:
      #cpu_cores: "0,1,2,3,4"
      Mp_std: 0
      Bp_std: 0

  - bob:
      #cpu_cores: "5,6,7,8,9"
      Mp_std: 0.7
      Bp_std: 0.7

  - claude:
      #cpu_cores: "10,11,12,13,14"
      Mp_std: 1.4
      Bp_std: 1.4

  - daniel:
      #cpu_cores: "15,16,17,18,19"
      Mp_std: 2.1
      Bp_std: 2.1

default_consumer_config:
  buffer_size: 5000
  batch_size: 32
  kafka_broker: kafka:9092
  kafka_auto_offset_reset: earliest
  anomaly_classes: all
  diagnostics_classes: all
  weights_push_freq_seconds: 40
  weights_pull_freq_seconds: 60
  training_freq_seconds: 0.01
  epoch_size: 20
  save_model_freq_epochs: 20
  # How often (in epochs) to run the adversarial benchmarks (Gaussian-noise eval
  # + HSJA). 
  run_benchmarks_freq_epochs: 5
  # Every Nth benchmark run (counted by run_benchmarks_freq_epochs triggers),
  # also send scatter plots / manifold projections / confusion matrices to W&B.
  # Scalar metrics are still sent to W&B on every benchmark run.
  plot_creation_freq_benchmarks: 5
  cpu_period: ${default_vehicle_config.cpu_period}
  cpu_quota: ${default_vehicle_config.cpu_quota}
  cpu_cores: ${default_vehicle_config.cpu_cores}
  adversarial_training: ${default_vehicle_config.adversarial_training}
  # Same lossy-uplink knob as the producer (see default_vehicle_config), applied
  # to this vehicle's own outbound messages (weights pushed for FL, statistics
  # reported to W&B). Defaults to the vehicle's rate; a per-vehicle override
  # under 'vehicles:' (e.g. packet_loss_rate: 0.3) applies to both producer and
  # consumer automatically, since both merge the same per-vehicle override dict.
  packet_loss_rate: ${default_vehicle_config.packet_loss_rate}
  seed: 777
  # Only takes effect when aggregation_strategy is fedprox. (Setting to 0.0 recovers FedAvg behaviour).
  fedprox_mu: 0.01
  # HopSkipJump decision-based adversarial evaluation (Chen et al., 2020).
  # Runs in a background thread every run_benchmarks_freq_epochs epochs alongside
  # the existing Gaussian-noise eval. Results are logged to W&B under
  # {vehicle}_statistics/hsja_adv_eval/* and {vehicle}_hsja_manifold_plot.
  # Set hsja_enabled: false to disable entirely (e.g. for lightweight runs).
  hsja_enabled: true
  hsja_n_per_class: 10      # samples per class attacked per evaluation round
  hsja_n_steps: 30          # boundary-walk iterations per sample
  hsja_n_grad_samples: 30   # random directions used for gradient estimation
  hsja_init_noise_scale: 3.0  # std of Gaussian noise used to find the initial adversarial point
  # When true, HSJA attacks CLEAN anchor samples (identical threat model for
  # every vehicle), so avg_perturbation/avg_queries measure the model boundary
  # rather than each vehicle's producer eval-stream noise. Set false for the
  # legacy behaviour of attacking the noisy eval stream.
  hsja_clean_anchors: true
  # Fixed Gaussian-noise std grid for the decoupled robustness eval
  # (sigma_grid_evaluation). Applied to the usBpPres/usMpPres features of clean
  # anomaly/attack samples, identical across the whole fleet. Set to [] to
  # disable the sigma-grid eval entirely.
  eval_sigmas: [0.5, 1.0, 1.5, 2.0]
  # Feature indices the attack is allowed to perturb (null = whole 40-dim
  # vector, the original/default behaviour). Set to [32, 33] to restrict
  # HSJA to usBpPres/usMpPres, matching the Gaussian adv_eval threat model
  # (Mp_std/Bp_std).
  hsja_feature_indices: [32,33]

anomaly_detection:
  output_dim: 3
  # Classifier architecture: mlp (default), cnn (1D-CNN over the feature vector),
  # or resnet (tabular ResNet, Gorishniy et al. 2021 - a stack of pre-activation
  # residual MLP blocks, a strong cheap baseline for tabular data).
  # All architectures share the same 2D manifold layer immediately before the
  # output head, so HSJA / manifold plots / FL aggregation work unchanged.
  model_type: mlp
  h_dim: 128
  num_layers: 1
  layer_norm: True
  dropout: 0.1
  input_dim: 40
  learning_rate: 0.05
  initialization_strategy: xavier
  optimizer: SGD

  
dashboard:
  port: 5000
  host: 0.0.0.0
  kafka_broker_url: kafka:9092
  kafka_consumer_group_id: kafka-consumer-group-1
  kafka_auto_offset_reset: earliest
  message_cache_len: 20
  ping_thread_timeout: 5
  ping_host: google.com
  probe_frequency_seconds: 5
  proxy: True

  
attack:
  target_port: 80
  duration: 0  # duration is in seconds. 0 means forever...
  packet_size: 1024
  delay: 0.001
  victim_container: zookeeper # be careful what you wish for...
  preconf_attacking_vehicles:
    - angela
    - bob
    - claude
    - daniel
  automatic_attack_interval_secs: 0.3
  bot_port: 5002
